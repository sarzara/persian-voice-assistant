# Start everything:  docker compose up --build
# All configuration comes from .env (see .env.example).

name: persian-voice-assistant

x-app: &app
  build: .
  image: persian-voice-assistant:latest
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      # Only POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read by the image.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No ports published: only the app containers can reach the database.

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Bound to loopback only: not reachable from other machines.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
