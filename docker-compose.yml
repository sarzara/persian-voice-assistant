# Start everything:  docker compose up --build
# All configuration comes from .env (see .env.example).

name: persian-voice-assistant

x-app: &app
  build: .
  image: persian-voice-assistant:latest
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      # Only POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read by the image.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No ports published: only the app containers can reach the database.

  # One-shot: applies migrations, then exits. bot and api wait for it to succeed,
  # so the schema is always current and only one process ever runs Alembic.
  migrate:
    <<: *app
    # Schema, then the dashboard's read-only role, then demo data on a fresh database (DEMO_DATA=true).
    command: ["sh", "deploy/migrate.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    volumes:
      - voice:/data/voice
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No ports: long polling only makes outbound connections to Telegram.

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Bound to loopback only: not reachable from other machines.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MCP server over streamable HTTP for IDEs (Bearer MCP_API_KEY). Claude Desktop uses stdio instead:
  #   docker compose run --rm -i -T --no-deps mcp python -m app.mcp.server
  mcp:
    <<: *app
    command: ["python", "-m", "app.mcp.server", "--http", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Usage & quality dashboard (read-only role). Locally: http://127.0.0.1:8080
  dashboard:
    <<: *app
    command: ["uvicorn", "app.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # HTTPS reverse proxy for DASHBOARD_HOST. Not needed locally; enable with:
  #   docker compose --profile proxy up -d
  caddy:
    image: caddy:2.10.2
    profiles: ["proxy"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  voice:
